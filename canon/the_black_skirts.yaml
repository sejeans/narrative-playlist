      - 피와 갈증 | Blood and Thirst | King of Hurts

  - name: TEEN TROUBLES
    aliases: [Teen Troubles]
    stage_prior: {회상: 1.0, 이별: 0.3}
    note: 사랑 3부작 3부. 사랑의 종착점이 젊은 날의 나를 향하는 회고. 1999년 여름 열일곱의 시점.
    tracklist:
      - Flying Bobs
