      - John Fry
      - 99%
      - Our Own Summer

songs:
  - title: Love is all
    aliases: [Love Is All]
    stage: 설렘
    note: 사랑에 빠져 있는 경쾌한 노래. 서사상 사랑의 한가운데.

  - title: 피와 갈증
    aliases: [Blood and Thirst, King of Hurts]
    stage: 이별
    where: late
    note: 이별의 막바지에 놓이는 곡. THIRSTY 의 마지막 트랙이자 가장 긴 곡.
